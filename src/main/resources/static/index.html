<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask My Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
:root{
    --bg:#08080d;
    --bg-elevated:#0e0e16;
    --surface:rgba(255,255,255,0.045);
    --surface-2:rgba(255,255,255,0.07);
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.16);
    --text:#edeef5;
    --text-dim:#9a9db0;
    --text-faint:#666a80;
    --accent-1:#8b7bfb;
    --accent-2:#4f9cff;
    --accent-grad:linear-gradient(135deg,var(--accent-1),var(--accent-2));
    --success:#3ddc97;
    --danger:#ff6b6b;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-soft:0 10px 40px rgba(0,0,0,0.45);
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-display:'Space Grotesk','Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
    margin:0;
    font-family:var(--font-body);
    color:var(--text);
    background:
        radial-gradient(1100px 600px at 15% -10%, rgba(139,123,251,0.16), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(79,156,255,0.12), transparent 55%),
        var(--bg);
    background-attachment:fixed;
    overflow:hidden;
}
.app{
    max-width:760px;
    margin:0 auto;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:1.1rem 1.25rem 0;
}

/* ---------- header ---------- */
.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    padding-bottom:0.9rem;
    flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:0.7rem;}
.brand-icon{
    width:38px;height:38px;border-radius:11px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 18px rgba(124,111,238,0.45);
    flex-shrink:0;
}
.brand-icon svg{width:20px;height:20px;}
.brand-title{font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-0.01em;line-height:1.2;}
.brand-sub{font-size:0.72rem;color:var(--text-faint);margin-top:1px;}

.header-right{display:flex;align-items:center;gap:0.6rem;}
.channel-pill{
    display:flex;align-items:center;gap:0.5rem;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:0.4rem 0.5rem 0.4rem 0.8rem;
    transition:border-color .2s ease, background .2s ease;
}
.channel-pill:hover{border-color:var(--border-strong);background:var(--surface-2);}
.status-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--text-faint);
    flex-shrink:0;
    transition:background .3s ease, box-shadow .3s ease;
}
.status-dot.ready{background:var(--success);box-shadow:0 0 8px rgba(61,220,151,0.7);}
.status-dot.error{background:var(--danger);}
.channel-label{font-size:0.82rem;color:var(--text-dim);font-weight:500;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
.icon-link{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    text-decoration:none;transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.icon-link:hover{background:var(--surface-2);color:var(--text);border-color:var(--border-strong);}
.icon-link svg{width:16px;height:16px;}

/* ---------- chat area ---------- */
.chat-area{flex:1;overflow-y:auto;padding:0.5rem 0 1rem;scroll-behavior:smooth;}
.chat-area::-webkit-scrollbar{width:6px;}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.chat-log{display:flex;flex-direction:column;gap:1.1rem;}

.empty-state{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    padding:2.6rem 1rem 1rem;color:var(--text-dim);
    animation:fadeUp .5s ease both;
}
.empty-icon{
    width:52px;height:52px;border-radius:16px;margin-bottom:1.1rem;
    background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
}
.empty-icon svg{width:24px;height:24px;color:var(--accent-2);}
.empty-state h2{font-family:var(--font-display);font-size:1.15rem;color:var(--text);margin:0 0 0.4rem;}
.empty-state p{font-size:0.85rem;color:var(--text-faint);margin:0 0 1.5rem;max-width:340px;}
.suggestions{display:flex;flex-wrap:wrap;gap:0.55rem;justify-content:center;max-width:480px;}
.suggestion-pill{
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    border-radius:999px;padding:0.5rem 0.95rem;font-size:0.78rem;font-family:var(--font-body);
    cursor:pointer;transition:all .18s ease;
}
.suggestion-pill:hover{border-color:var(--accent-1);color:var(--text);background:var(--surface-2);transform:translateY(-1px);}

.msg-row{display:flex;gap:0.65rem;align-items:flex-start;animation:fadeUp .35s cubic-bezier(.2,.7,.3,1) both;}
.msg-row.user{flex-direction:row-reverse;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.avatar{
    width:30px;height:30px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:0.68rem;font-weight:700;font-family:var(--font-display);
    margin-top:2px;
}
.avatar.bot{background:var(--accent-grad);color:#fff;}
.avatar.user{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);}

.bubble{
    max-width:76%;padding:0.75rem 1rem;border-radius:var(--radius-md);
    font-size:0.9rem;line-height:1.55;
}
.msg-row.user .bubble{
    background:var(--accent-grad);color:#fff;border-bottom-right-radius:4px;
    box-shadow:0 6px 20px rgba(124,111,238,0.28);
}
.msg-row.bot .bubble{
    background:var(--surface);border:1px solid var(--border);
    border-bottom-left-radius:4px;color:var(--text);
}
.bubble p{margin:0 0 0.6em;}
.bubble p:last-child{margin-bottom:0;}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{
    font-family:var(--font-display);font-size:0.92rem;font-weight:700;
    color:var(--text);margin:0.9em 0 0.35em;
}
.bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0;}
.bubble ul,.bubble ol{margin:0.3em 0 0.7em;padding-left:1.2em;}
.bubble li{margin-bottom:0.3em;}
.bubble strong{color:var(--text);font-weight:700;}
.msg-row.user .bubble strong{color:#fff;}
.bubble code{background:rgba(255,255,255,0.08);padding:0.1em 0.4em;border-radius:5px;font-size:0.85em;}

.thinking-dots{display:flex;gap:4px;padding:0.2rem 0;}
.thinking-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--text-dim);
    animation:dotBounce 1.1s ease-in-out infinite;
}
.thinking-dots span:nth-child(2){animation-delay:.15s;}
.thinking-dots span:nth-child(3){animation-delay:.3s;}
@keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-5px);opacity:1;}}

.citations{
    display:flex;gap:0.5rem;margin-top:0.75rem;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none;
}
.citations::-webkit-scrollbar{display:none;}
.citation-chip{
    flex-shrink:0;display:flex;align-items:center;gap:0.4rem;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:999px;padding:0.4rem 0.75rem 0.4rem 0.55rem;
    text-decoration:none;color:var(--text-dim);font-size:0.72rem;font-weight:500;
    max-width:210px;transition:all .18s ease;
}
.citation-chip:hover{border-color:var(--accent-2);color:var(--text);transform:translateY(-2px);box-shadow:0 6px 16px rgba(79,156,255,0.2);}
.citation-chip svg{width:11px;height:11px;flex-shrink:0;color:var(--accent-2);}
.citation-chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.citation-tooltip-float{
    position:fixed;z-index:10000;width:200px;aspect-ratio:16/9;
    background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:var(--radius-sm);
    overflow:hidden;box-shadow:var(--shadow-soft);pointer-events:none;display:none;
}
.citation-tooltip-float img{width:100%;height:100%;object-fit:cover;display:block;}

.msg-actions{display:flex;gap:0.4rem;margin-top:0.7rem;}
.action-btn{
    display:flex;align-items:center;gap:0.35rem;
    background:none;border:1px solid var(--border);color:var(--text-faint);
    border-radius:999px;padding:0.3rem 0.65rem;font-size:0.7rem;font-family:var(--font-body);
    cursor:pointer;transition:all .15s ease;
}
.action-btn:hover{border-color:var(--border-strong);color:var(--text-dim);background:var(--surface-2);}
.action-btn.copied{color:var(--success);border-color:var(--success);}
.action-btn svg{width:12px;height:12px;}

/* ---------- composer ---------- */
.composer{flex-shrink:0;padding:0.9rem 0 1.1rem;}
.composer-inner{
    display:flex;align-items:center;gap:0.6rem;
    background:var(--bg-elevated);border:1px solid var(--border);
    border-radius:999px;padding:0.35rem 0.4rem 0.35rem 1.1rem;
    box-shadow:var(--shadow-soft);
    transition:border-color .2s ease, box-shadow .2s ease;
}
.composer-inner:focus-within{border-color:var(--accent-1);box-shadow:var(--shadow-soft), 0 0 0 3px rgba(139,123,251,0.18);}
.composer-inner input{
    flex:1;background:none;border:none;outline:none;color:var(--text);
    font-family:var(--font-body);font-size:0.9rem;padding:0.5rem 0;
}
.composer-inner input::placeholder{color:var(--text-faint);}
.send-btn{
    width:38px;height:38px;border-radius:50%;border:none;flex-shrink:0;
    background:var(--accent-grad);color:#fff;display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .15s ease, opacity .15s ease;
}
.send-btn:hover{transform:scale(1.06);}
.send-btn:active{transform:scale(0.92);}
.send-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.send-btn svg{width:16px;height:16px;}
.send-btn.stop-mode{background:var(--danger);}

button.icon-link{cursor:pointer;font:inherit;}
.new-chat-btn{
    display:flex;align-items:center;gap:0.4rem;flex-shrink:0;white-space:nowrap;
    background:var(--surface);border:1px solid var(--border);color:var(--text-dim);
    border-radius:999px;padding:0.45rem 0.9rem 0.45rem 0.7rem;
    font-size:0.78rem;font-weight:500;font-family:var(--font-body);
    cursor:pointer;transition:all .18s ease;
}
.new-chat-btn:hover{border-color:var(--border-strong);color:var(--text);background:var(--surface-2);}
.new-chat-btn svg{width:14px;height:14px;flex-shrink:0;}
.chat-status{font-size:0.72rem;color:var(--danger);text-align:center;margin-top:0.5rem;min-height:1em;}

/* ---------- cursor glow ---------- */
.cursor-glow{
    position:fixed;top:0;left:0;width:380px;height:380px;
    border-radius:50%;pointer-events:none;z-index:9998;
    background:radial-gradient(circle, rgba(139,123,251,0.20), rgba(79,156,255,0.09) 40%, transparent 72%);
    transform:translate(-50%,-50%);
    mix-blend-mode:screen;
    opacity:0;transition:opacity .4s ease, width .35s ease, height .35s ease;
    will-change:transform;
}
.cursor-glow.visible{opacity:1;}
.cursor-glow.hover{width:520px;height:520px;}
.cursor-ring{
    position:fixed;top:0;left:0;width:22px;height:22px;
    border:1.5px solid rgba(139,123,251,0.55);border-radius:50%;
    pointer-events:none;z-index:9999;
    transform:translate(-50%,-50%);
    opacity:0;transition:opacity .3s ease, width .25s cubic-bezier(.2,.8,.3,1.3), height .25s cubic-bezier(.2,.8,.3,1.3), border-color .25s ease, background .25s ease;
    will-change:transform;
}
.cursor-ring.visible{opacity:1;}
.cursor-ring.hover{width:46px;height:46px;border-color:rgba(79,156,255,0.85);background:rgba(79,156,255,0.08);}
@media (hover:none), (pointer:coarse){
    .cursor-glow,.cursor-ring{display:none;}
}
</style>
</head>
<body>

<div class="cursor-glow" id="cursorGlow"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="app">
    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7-11-7z" fill="white"/></svg>
            </div>
            <div>
                <div class="brand-title">Ask My Channel</div>
                <div class="brand-sub">Grounded answers from this channel's content</div>
            </div>
        </div>
        <div class="header-right">
            <div class="channel-pill" id="channelPill">
                <span class="status-dot" id="statusDot"></span>
                <span class="channel-label" id="channelLabel">Loading…</span>
            </div>
            <button class="new-chat-btn" id="newChatBtn" type="button" title="Start a new chat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                <span>New Chat</span>
            </button>
            <a class="icon-link" href="profile.html" title="Profile settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </a>
        </div>
    </header>

    <main class="chat-area" id="chatArea">
        <div class="chat-log" id="chatLog">
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2>Ask anything from the channel</h2>
                <p>Grounded answers with timestamped citations back to the exact video.</p>
                <div class="suggestions" id="suggestions">
                    <button class="suggestion-pill">How do I prepare for an Infosys interview?</button>
                    <button class="suggestion-pill">What should go on my resume as a fresher?</button>
                    <button class="suggestion-pill">How does the Accenture interview process work?</button>
                    <button class="suggestion-pill">How should I prepare for aptitude tests?</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="composer">
        <div class="composer-inner">
            <input id="questionInput" type="text" placeholder="Ask a question about the channel…">
            <button class="send-btn" id="askBtn" title="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
        </div>
        <div class="chat-status" id="chatStatus"></div>
    </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const channelLabel = $('channelLabel'), statusDot = $('statusDot');
const chatArea = $('chatArea'), chatLog = $('chatLog'), emptyState = $('emptyState'), suggestions = $('suggestions');
const questionInput = $('questionInput'), askBtn = $('askBtn'), chatStatus = $('chatStatus');

// {question, answer, citations} per turn — the server itself holds no session state, this is
// the entire chat session. Persisted to localStorage (per channel handle) so a reload restores
// the same conversation instead of starting over; "New chat" clears it explicitly.
let chatTurns = [];
let isStreaming = false;
let activeAbortController = null;

function storageKey(){ return 'askmychannel:chat:' + (activeHandle || 'default'); }
function saveChatState(){
    try { localStorage.setItem(storageKey(), JSON.stringify(chatTurns)); } catch (e) { /* storage unavailable, ignore */ }
}
function loadChatState(){
    try {
        const raw = localStorage.getItem(storageKey());
        if (!raw) return;
        const turns = JSON.parse(raw);
        if (!Array.isArray(turns) || turns.length === 0) return;
        turns.forEach(t => {
            appendUserMessage(t.question);
            renderBotBubbleContent(appendBotRow(), t.answer, t.citations);
        });
        chatTurns = turns;
        scrollToBottom();
    } catch (e) { /* corrupted storage, ignore */ }
}

let activeHandle = null;
function currentHandle(){ return activeHandle; }
function setStatusDot(state){ statusDot.className = 'status-dot' + (state ? ' ' + state : ''); }
function scrollToBottom(){ requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; }); }

async function initActiveChannel(){
    try {
        const res = await fetch('/api/profile/active-channel');
        const data = await res.json();
        if (data.channelHandle) {
            activeHandle = data.channelHandle;
            channelLabel.textContent = data.channelTitle || data.channelHandle;
            setStatusDot('ready');
            loadChatState();
        } else {
            channelLabel.textContent = 'No channel configured';
            setStatusDot('error');
            questionInput.placeholder = 'Ask the site owner to set up a channel on the profile page';
            questionInput.disabled = true;
            askBtn.disabled = true;
        }
    } catch (e) {
        channelLabel.textContent = 'Connection error';
        setStatusDot('error');
    }
}
initActiveChannel();

function renderMarkdown(text){
    const raw = marked.parse(text, {breaks: true});
    return (window.DOMPurify ? DOMPurify.sanitize(raw) : raw);
}

function appendUserMessage(text){
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="avatar user">You</div><div class="bubble"></div>`;
    row.querySelector('.bubble').textContent = text;
    chatLog.appendChild(row);
    scrollToBottom();
    return row;
}

function appendBotThinking(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar bot">AI</div><div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>`;
    chatLog.appendChild(row);
    scrollToBottom();
    return row;
}

function appendBotRow(){
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.innerHTML = `<div class="avatar bot">AI</div><div class="bubble"></div>`;
    chatLog.appendChild(row);
    return row.querySelector('.bubble');
}

function renderBotBubbleContent(bubble, answer, citations){
    bubble.innerHTML = renderMarkdown(answer);
    appendCitations(bubble, citations);
    appendMessageActions(bubble, answer);
}

function appendCitations(bubble, citations){
    if (!citations || citations.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'citations';
    citations.forEach(c => {
        const a = document.createElement('a');
        a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; a.className = 'citation-chip';
        const videoIdMatch = c.url.match(/youtu\.be\/([\w-]+)/);
        if (videoIdMatch) a.dataset.thumb = `https://img.youtube.com/vi/${videoIdMatch[1]}/hqdefault.jpg`;
        a.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7-11-7z"/></svg><span></span>`;
        a.querySelector('span').textContent = c.videoTitle;
        wrap.appendChild(a);
    });
    bubble.appendChild(wrap);
}

// Single shared tooltip element positioned via getBoundingClientRect on hover — avoids clipping
// against the citations row's own horizontal-scroll overflow, which an absolutely-positioned
// child tooltip would be clipped by. Size is fixed via CSS (200 x 112.5, 16:9) so position can
// be computed immediately rather than waiting on the thumbnail image to load.
const TOOLTIP_W = 200, TOOLTIP_H = 112;
const citationTooltip = document.createElement('div');
citationTooltip.className = 'citation-tooltip-float';
document.body.appendChild(citationTooltip);

function showCitationTooltip(chip){
    const thumb = chip.dataset.thumb;
    if (!thumb) return;
    citationTooltip.innerHTML = `<img src="${thumb}" alt="">`;
    citationTooltip.style.display = 'block';
    const rect = chip.getBoundingClientRect();
    let left = Math.max(8, Math.min(rect.left + rect.width / 2 - TOOLTIP_W / 2, window.innerWidth - TOOLTIP_W - 8));
    let top = rect.top - TOOLTIP_H - 10;
    if (top < 8) top = rect.bottom + 10;
    citationTooltip.style.left = left + 'px';
    citationTooltip.style.top = top + 'px';
}
function hideCitationTooltip(){ citationTooltip.style.display = 'none'; }

chatLog.addEventListener('mouseover', e => {
    const chip = e.target.closest('.citation-chip');
    if (chip) showCitationTooltip(chip);
});
chatLog.addEventListener('mouseout', e => {
    if (e.target.closest('.citation-chip')) hideCitationTooltip();
});
chatArea.addEventListener('scroll', hideCitationTooltip);

function appendMessageActions(bubble, text){
    const wrap = document.createElement('div');
    wrap.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'action-btn';
    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>Copy</span>`;
    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(text);
            const span = copyBtn.querySelector('span');
            span.textContent = 'Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => { span.textContent = 'Copy'; copyBtn.classList.remove('copied'); }, 1500);
        } catch (e) { /* clipboard unavailable, ignore */ }
    });
    wrap.appendChild(copyBtn);
    bubble.appendChild(wrap);
}

function setComposerStreaming(streaming){
    isStreaming = streaming;
    askBtn.classList.toggle('stop-mode', streaming);
    askBtn.title = streaming ? 'Stop generating' : 'Send';
    askBtn.innerHTML = streaming
        ? `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`
        : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
}

// Parses one or more complete "event: x\ndata: y\n\n" SSE frames out of the front of buf,
// returning the leftover partial frame (if any) so the caller can keep accumulating it.
function consumeSseFrames(buf, onEvent){
    let boundary;
    while ((boundary = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, boundary);
        buf = buf.slice(boundary + 2);
        let eventName = 'message';
        const dataLines = [];
        for (const line of frame.split('\n')) {
            if (line.startsWith('event:')) eventName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        if (dataLines.length > 0) onEvent(eventName, dataLines.join('\n'));
    }
    return buf;
}

async function ask(question){
    const handle = currentHandle();
    if (!handle || !question || isStreaming) return;

    appendUserMessage(question);
    const thinkingRow = appendBotThinking();
    const bubble = thinkingRow.querySelector('.bubble');
    chatStatus.textContent = '';
    setComposerStreaming(true);

    const abortController = new AbortController();
    activeAbortController = abortController;

    let fullAnswer = '';
    let citations = [];
    let firstToken = true;
    let aborted = false;
    let errored = false;

    try {
        const res = await fetch(`/api/channels/${encodeURIComponent(handle)}/chat/stream`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({question, history: chatTurns.map(({question, answer}) => ({question, answer}))}),
            signal: abortController.signal
        });
        if (!res.ok){ const err = await res.json().catch(() => ({message: res.statusText})); throw new Error(err.message); }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const {value, done} = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, {stream: true});
            buffer = consumeSseFrames(buffer, (eventName, data) => {
                if (eventName === 'citations') {
                    citations = JSON.parse(data);
                } else if (eventName === 'token') {
                    if (firstToken) { firstToken = false; bubble.innerHTML = ''; }
                    fullAnswer += JSON.parse(data);
                    bubble.innerHTML = renderMarkdown(fullAnswer);
                    scrollToBottom();
                }
            });
        }
    } catch (e) {
        if (e.name === 'AbortError') {
            aborted = true;
            if (firstToken) thinkingRow.remove();
        } else {
            errored = true;
            if (firstToken) thinkingRow.remove();
            chatStatus.textContent = e.message;
        }
    } finally {
        if (activeAbortController === abortController) activeAbortController = null;
        setComposerStreaming(false);
    }

    if (!errored && !firstToken) {
        if (aborted) fullAnswer += '\n\n*(stopped)*';
        renderBotBubbleContent(bubble, fullAnswer, citations);
        chatTurns.push({question, answer: fullAnswer, citations});
        saveChatState();
        setStatusDot('ready');
    }
    scrollToBottom();
}

askBtn.addEventListener('click', () => {
    if (isStreaming) {
        if (activeAbortController) activeAbortController.abort();
        return;
    }
    const q = questionInput.value.trim();
    if (!q) return;
    questionInput.value = '';
    ask(q);
});

$('newChatBtn').addEventListener('click', () => {
    if (isStreaming && activeAbortController) activeAbortController.abort();
    chatTurns = [];
    try { localStorage.removeItem(storageKey()); } catch (e) { /* storage unavailable, ignore */ }
    chatLog.innerHTML = '';
    chatLog.appendChild(emptyState);
    emptyState.style.display = 'flex';
    chatStatus.textContent = '';
});
questionInput.addEventListener('keydown', e => { if (e.key === 'Enter') askBtn.click(); });
suggestions.addEventListener('click', e => {
    const btn = e.target.closest('.suggestion-pill');
    if (!btn) return;
    ask(btn.textContent);
});

/* ---------- cursor glow trail ---------- */
(function initCursorGlow(){
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const noHover = window.matchMedia('(hover: none), (pointer: coarse)').matches;
    if (reduceMotion || noHover) return;

    const glow = $('cursorGlow'), ring = $('cursorRing');
    let mouseX = 0, mouseY = 0;
    let glowX = 0, glowY = 0;
    let ringX = 0, ringY = 0;
    let started = false;

    const HOVER_SELECTOR = 'button, a, input, .suggestion-pill, .citation-chip, .icon-btn';

    window.addEventListener('mousemove', e => {
        mouseX = e.clientX; mouseY = e.clientY;
        if (!started) {
            started = true;
            glowX = ringX = mouseX; glowY = ringY = mouseY;
            glow.classList.add('visible');
            ring.classList.add('visible');
        }
        const isHovering = !!e.target.closest(HOVER_SELECTOR);
        glow.classList.toggle('hover', isHovering);
        ring.classList.toggle('hover', isHovering);
    });
    window.addEventListener('mouseleave', () => {
        glow.classList.remove('visible');
        ring.classList.remove('visible');
        started = false;
    });

    function tick(){
        // ring tracks tightly for responsiveness, glow trails behind for an ambient feel
        ringX += (mouseX - ringX) * 0.35;
        ringY += (mouseY - ringY) * 0.35;
        glowX += (mouseX - glowX) * 0.09;
        glowY += (mouseY - glowY) * 0.09;
        ring.style.transform = `translate(${ringX}px, ${ringY}px) translate(-50%, -50%)`;
        glow.style.transform = `translate(${glowX}px, ${glowY}px) translate(-50%, -50%)`;
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
})();
</script>
