# Postgres is hosted externally (e.g. Neon's free tier, which doesn't expire) rather than on
# Render, whose free databases are deleted after 30 days. Set DB_URL to a JDBC URL with
# sslmode=require, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
services:
  - type: web
    name: ask-my-channel
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PROFILE_PASSPHRASE
        sync: false
